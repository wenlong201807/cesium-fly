# Docker 编排（加固版）
# 内存限制 + 安全 + 健康检查
services:
  web:
    build:
      context: ../..
      dockerfile: script/docker/Dockerfile
      args:
        VITE_TIANDITU_TK: ${VITE_TIANDITU_TK:-}
    container_name: cesium-fly-web
    ports:
      - '${PORT_WEB:-8080}:80'
    restart: unless-stopped
    networks:
      - cesium-net
    # 内存限制
    mem_limit: 128m
    memswap_limit: 192m
    # 安全：禁止新增特权
    security_opt:
      - no-new-privileges:true
    # 只读文件系统（除 /tmp /run）
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/nginx-health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mock-server:
    build:
      context: ../../mock-server
      dockerfile: Dockerfile
    container_name: cesium-fly-mock
    # 只暴露给内网，不暴露到 host
    expose:
      - '3000'
    restart: unless-stopped
    networks:
      - cesium-net
    # 内存限制
    mem_limit: 64m
    memswap_limit: 96m
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

networks:
  cesium-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
