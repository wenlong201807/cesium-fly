# nginx 加固配置（生产环境）
# 性能 + 内存 + 安全

# ─── 性能优化 ───────────────────────────────────
sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
keepalive_requests 100;

# 工作进程：auto 自动跟 CPU 核数
worker_processes auto;
worker_rlimit_nofile 65535;

# ─── 安全：隐藏 nginx 版本 ──────────────────────
server_tokens off;

# ─── MIME / 日志 ────────────────────────────────
include /etc/nginx/mime.types;
default_type application/octet-stream;
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';
access_log /var/log/nginx/access.log main buffer=32k flush=5s;

# ─── Gzip 压缩（性能） ──────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml;

# ─── 限流：防 API 刷接口 ────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── 安全头（CSP / XSS / MIME-sniff / Referrer / HSTS） ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS 仅在 HTTPS 站点有意义（保留供未来 HTTPS 部署）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tianditu.gov.cn; connect-src 'self' https://*.tianditu.gov.cn; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # ─── 请求体 / 超时（防 DoS） ──────────────────
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # ─── 前端 SPA：所有非 /api 路由回退到 index.html ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── 反向代理：/api → mock-server 容器（内网） ───
    location /api/ {
        # 限流
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://mock-server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering on;
    }

    # ─── 健康检查端点（容器编排用） ────────────────
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ─── 静态资源：长缓存（immutable） ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|glb|gltf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── 禁止访问 .git / .env 等敏感路径 ──────────
    location ~ /\.(git|env|docker) {
        deny all;
        return 404;
    }
}